<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papiro — Markdown editor and reader for the terminal</title>
<meta name="description" content="Papiro is a minimal Markdown editor and reader for the terminal, written in Rust. Install it with cargo install ppr.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><div id="doc" class="doc v" aria-live="polite"></div></main>
<footer>
  <span class="l"><span id="name">papiro.md</span> <span style="color:var(--acc)">•</span> 0.1.2</span>
  <div class="actions">
    <button id="lang" type="button" title="Ver en español" aria-label="Ver en español"><span id="langlabel">ES</span></button>
    <button id="tg" type="button"><span class="full" id="hint">Ctrl+V view Markdown</span><span class="short">View source</span></button>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
